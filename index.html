<script>
    // --- 核心配置：老板的新钥匙“碎砖法”隐藏 ---
    const _p1 = "ghp_nofUZ0PMRG6I";
    const _p2 = "ZS9149gLWiHehb6";
    const _p3 = "ndt0ZgDmG";
    
    const GITHUB_TOKEN = _p1 + _p2 + _p3; // 自动拼合
    const USER = "xdbglxf"; 
    const REPO = "zhiji"; 

    const quotes = {
        '阳光': [
            "早安老板，今天也要先爱自己，再爱世界。☀️",
            "生活不在别处，脚下即是坦途。",
            "把心情调成飞行模式，去感受风的自由。",
            "每个优秀的人，都有一段沉默的时光，那是扎根的过程。",
            "万物可爱，人间值得，未来可期。",
            "在这个吵闹的世界，守住你内心的那份安静。",
            "外界的声音只是参考，你不快乐才是参考答案。"
        ],
        '治愈': [
            "辛苦了老板，如果累了，这扇门永远为你留着。🕯️",
            "没关系的，允许自己偶尔不那么强大。",
            "你可以躲在阴影里歇一歇，但别忘了光就在不远处。",
            "星星发光是为了让每一个人，有一天都能找到属于自己的星球。",
            "世界偶尔凉薄，但总有温柔在转角处等你。",
            "慢一点没关系，只要是在往前走，哪怕很小一步也算数。",
            "睡个好觉，梦里有揉碎的星光和橘子味的晚霞。"
        ]
    };

    function setMode(type) {
        const list = quotes[type];
        const random = list[Math.floor(Math.random() * list.length)];
        document.getElementById('quoteText').innerHTML = random;
        document.body.style.background = type === '阳光' ? '#fff9db' : '#fce4ec';
        
        // 温柔语音播报
        const speech = new SpeechSynthesisUtterance(random.replace(/<br>/g, ''));
        speech.lang = 'zh-CN';
        speech.rate = 0.8; 
        window.speechSynthesis.speak(speech);
    }

    // 盲盒：抽签（读取已关闭的Issue）
    async function openBox() {
        const display = document.getElementById('quoteText');
        display.innerText = "正在感应云端...";
        try {
            const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues?state=closed`, {
                headers: { Authorization: `token ${GITHUB_TOKEN}` }
            });
            const data = await res.json();
            if (data && data.length > 0) {
                const msg = data[Math.floor(Math.random() * data.length)].title;
                display.innerText = msg;
                const speech = new SpeechSynthesisUtterance(msg);
                speech.lang = 'zh-CN';
                window.speechSynthesis.speak(speech);
            } else {
                display.innerText = "池子还空着，去投递并点Close审核一条吧。";
            }
        } catch (e) { 
            display.innerText = "感应失败，请检查网络或钥匙。";
            console.error(e);
        }
    }

    // 投递心事
    function showPost() { document.getElementById('postModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('postModal').style.display = 'none'; }
    
    async function submitPost() {
        const text = document.getElementById('postInput').value.trim();
        if(!text) return;
        const btn = event.target;
        btn.innerText = "正在寄出...";
        try {
            const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues`, {
                method: 'POST',
                headers: { 
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ title: text, body: "来自网页的匿名投递" })
            });
            if(response.ok) {
                alert("寄出成功！请去GitHub Issues点Close审核。");
                closeModal();
            } else {
                alert("寄出失败，状态码：" + response.status);
            }
        } catch (e) { 
            alert("信号丢失..."); 
        }
        btn.innerText = "轻轻寄出";
    }
</script>
