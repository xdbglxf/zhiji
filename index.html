<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>知己 | 千里江山</title>
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root { --dai-qing: #2b5f58; --txt-main: #34495e; --bg-mask: rgba(253, 253, 252, 0.94); }
        body { margin: 0; font-family: "STKaiti", "KaiTi", serif; transition: 1s; overflow: hidden; background: #fdfdfc; }
        
        /* 1. 动态书画背景层：增加模糊度，防止抢戏 */
        #bg-canvas { position: fixed; inset: 0; background-size: cover; background-position: center; filter: blur(5px) opacity(0.7); transition: background-image 2s ease-in-out; z-index: -1; }
        #bg-mask { position: fixed; inset: 0; background: var(--bg-mask); z-index: -1; }

        /* 2. 雅致加载层（解决白屏） */
        #loader { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fdfdfc; z-index: 1000; transition: 0.8s; }
        .circle { width: 40px; height: 40px; border: 2px solid var(--dai-qing); border-radius: 50%; opacity: 0.05; animation: pulse 2.5s infinite; }
        
        /* 3. 主布局 */
        .container { height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 0 10%; box-sizing: border-box; color: var(--txt-main); }
        
        /* 右上角静音开关：低调美观 */
        #muteBtn { position: absolute; top: 25px; right: 25px; font-size: 1.1rem; cursor: pointer; opacity: 0.3; z-index: 100; transition: 0.3s; }
        #muteBtn:hover { opacity: 0.6; }

        /* C位美文：增加呼吸感 */
        .content-area { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; max-width: 500px; text-align: justify; }
        #quoteText { font-size: 1.35rem; line-height: 2.3; opacity: 0; transition: 1.2s; white-space: pre-wrap; letter-spacing: 1px; }
        
        /* 底部按钮：黛青细边框 */
        footer { width: 100%; max-width: 400px; padding-bottom: 50px; display: flex; flex-direction: column; gap: 18px; }
        .btn { border-radius: 40px; padding: 15px; font-size: 0.95rem; cursor: pointer; transition: 0.3s; letter-spacing: 3px; border: 1px solid transparent; }
        .btn-primary { background: var(--dai-qing); color: white; box-shadow: 0 4px 15px rgba(43,95,88,0.1); }
        .btn-sub { background: none; border: 1px solid #eee; color: #aaa; }
        
        /* 限制状态 */
        .btn-disabled { opacity: 0.3 !important; cursor: not-allowed !important; background: #eee !important; color: #999 !important; box-shadow: none !important; border: 1px solid #ddd !important; }

        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.03; } 50% { opacity: 0.15; } 100% { transform: scale(1.05); opacity: 0.03; } }

        /* 夜晚模式自适应 */
        body.night { --bg-mask: rgba(26, 26, 26, 0.95); --txt-main: #b0bec5; }
        body.night #loader { background: #1a1a1a; }
        body.night .btn-sub { border: 1px solid #333; color: #666; }
    </style>
</head>
<body>
    <div id="bg-canvas"></div>
    <div id="bg-mask"></div>

    <div id="loader">
        <div class="circle"></div>
        <p style="margin-top:20px; color:var(--dai-qing); opacity:0.4; letter-spacing:8px; font-size:0.8rem; font-weight:normal;">见信如晤</p>
    </div>
    
    <div id="muteBtn" onclick="toggleMute()">🔊</div>

    <div class="container">
        <header style="padding-top:40px; opacity:0.15; letter-spacing:12px; font-size:0.75rem; font-weight:normal;">知己</header>
        
        <main class="content-area">
            <div id="quoteText"></div>
        </main>

        <footer>
            <button class="btn btn-primary" onclick="fetchQuote()">换一则心情</button>
            <button id="boxBtn" class="btn btn-sub" onclick="openBox()">感应盲盒 (3/3)</button>
            <div id="postLink" style="font-size:0.75rem; color:#eee; cursor:pointer; text-align:center; margin-top:5px; opacity:0.6;" onclick="showPost()">— 投递心事 —</div>
        </footer>
    </div>

    <script>
        const _p = ["ghp_nofUZ0PMRG6I", "ZS9149gLWiHehb6", "ndt0ZgDmG"];
        const GITHUB_TOKEN = _p.join("");
        const USER = "xdbglxf", REPO = "zhiji";

        // 关键词与书画背景匹配字典
        const bgMap = {
            'qianshan': ['山', '江', '河', '辽阔', '霞', '秋水', '滕王阁', '峨眉', '千山', '王勃', '王希孟'],
            'qingming': ['粥', '鲈鱼', '荔枝', '粗茶淡饭', '汤圆', '市井', '烟火', '清明', '苏轼', '张择端'],
            'huaniao': ['花', '菊', '荷', '春江', '清茶', '柳暗花明', '端端', '写生', '赵昌', '蛱蝶'],
            'yeyan': ['酒', '饮', '月', '深夜', '灯火', '中秋', '春节', '韩熙载', '顾闳中', '夜宴']
        };

        // 静音逻辑
        let isMuted = localStorage.getItem('muted') === 'true';
        document.getElementById('muteBtn').innerText = isMuted ? '🔇' : '🔊';

        // 每日计数逻辑
        function getTodayKey() { return new Date().toDateString(); }
        function getCount(type) { 
            const data = JSON.parse(localStorage.getItem(type) || '{}');
            return data.date === getTodayKey() ? data.count : 0;
        }
        function addCount(type) {
            localStorage.setItem(type, JSON.stringify({ date: getTodayKey(), count: getCount(type) + 1 }));
            updateButtons();
        }

        function updateButtons() {
            const boxCount = getCount('box');
            const postCount = getCount('post');
            
            const boxBtn = document.getElementById('boxBtn');
            if(boxCount >= 3) {
                boxBtn.innerText = "今日感应已满";
                boxBtn.classList.add('btn-disabled');
                boxBtn.onclick = null;
            } else {
                boxBtn.innerText = `感应盲盒 (${3 - boxCount}/3)`;
            }

            const postLink = document.getElementById('postLink');
            if(postCount >= 3) {
                postLink.style.opacity = "0.05";
                postLink.style.cursor = "default";
                postLink.onclick = null;
            } else {
                postLink.innerText = `— 投递心事 (${3 - postCount}/3) —`;
            }
        }

        // 根据文案内容切换背景
        function changeBackground(text) {
            const bgCanvas = document.getElementById('bg-canvas');
            let bgType = 'general'; // 默认背景

            for (const [key, keywords] of Object.entries(bgMap)) {
                if (keywords.some(keyword => text.includes(keyword))) {
                    bgType = key;
                    break;
                }
            }
            bgCanvas.style.backgroundImage = `url('bg_${bgType}.jpg?v=${Date.now()}')`;
        }

        async function fetchQuote() {
            const display = document.getElementById('quoteText');
            display.style.opacity = 0;
            const hour = new Date().getHours();
            const isNight = hour < 6 || hour >= 18;
            document.body.className = isNight ? 'night' : '';

            try {
                // 读取 quotes.json
                const res = await fetch(`./quotes.json?v=${Date.now()}`);
                const data = await res.json();
                const pool = isNight ? data.night : data.morning;
                const msg = pool[Math.floor(Math.random() * pool.length)];
                
                setTimeout(() => {
                    display.innerText = msg;
                    changeBackground(msg); // 切换背景
                    display.style.opacity = 1;
                    hideLoader();
                    if(!isMuted) speak(msg);
                }, 600);
            } catch (e) {
                display.innerText = "寻常日子，清欢随心。";
                changeBackground('general');
                hideLoader();
            }
        }

        async function openBox() {
            if(getCount('box') >= 3) return;
            const display = document.getElementById('quoteText');
            display.style.opacity = 0;
            changeBackground('general');

            try {
                const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues?state=all&sort=updated`, {
                    headers: { Authorization: `token ${GITHUB_TOKEN}` }
                });
                const data = await res.json();
                if(data.length > 0) {
                    const msg = data[Math.floor(Math.random() * data.length)].title;
                    setTimeout(() => {
                        display.innerText = "【盲盒感应】\n" + msg;
                        display.style.opacity = 1;
                        if(!isMuted) speak(msg);
                        addCount('box');
                    }, 400);
                }
            } catch (e) { display.innerText = "感应失败了..."; display.style.opacity = 1; }
        }

        function showPost() {
            if(getCount('post') >= 3) return;
            const msg = prompt(`在此刻，留下你的呼吸...\n(今日剩余 ${3 - getCount('post')} 次)`);
            if(msg) submitPost(msg);
        }

        async function submitPost(text) {
            try {
                await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues`, {
                    method: 'POST',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: text, body: "网页投递" })
                });
                alert("已寄出。");
                addCount('post');
            } catch (e) { alert("信号丢失..."); }
        }

        function toggleMute() {
            isMuted = !isMuted;
            localStorage.setItem('muted', isMuted);
            document.getElementById('muteBtn').innerText = isMuted ? '🔇' : '🔊';
            window.speechSynthesis.cancel();
        }

        function speak(msg) {
            window.speechSynthesis.cancel();
            const cleanMsg = msg.includes('】') ? msg.split('】')[1] : msg;
            const s = new SpeechSynthesisUtterance(cleanMsg);
            s.lang = 'zh-CN'; s.rate = 0.9;
            window.speechSynthesis.speak(s);
        }

        function hideLoader() {
            const loader = document.getElementById('loader');
            loader.style.opacity = 0;
            setTimeout(() => loader.style.display = 'none', 1000);
        }

        // 页面加载完成后自动执行一次
        window.addEventListener('load', () => {
            updateButtons();
            fetchQuote();
        });
    </script>
</body>
</html>
