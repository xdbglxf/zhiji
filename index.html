<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知己 | 你的私人角落</title>
    <style>
        :root { --day-bg: #f7f8f3; --night-bg: #2c3e50; --day-text: #2f3542; --night-text: #f1f2f6; }
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: "STKaiti", "KaiTi", serif; transition: 1s; overflow: hidden; }
        .main-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; width: 85%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.3); }
        h1 { font-size: 1.8rem; letter-spacing: 5px; margin: 0; color: #333; }
        #tag { font-size: 0.9rem; margin-top: 10px; opacity: 0.7; }
        .content-area { margin: 30px 0; min-height: 180px; display: flex; align-items: center; justify-content: center; line-height: 2; font-size: 1.15rem; color: #444; text-align: justify; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        .action-btn { background: #57606f; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; letter-spacing: 2px; transition: 0.3s; font-size: 1rem; }
        .action-btn:hover { background: #2f3542; }
        .footer { margin-top: 25px; font-size: 0.8rem; opacity: 0.5; cursor: pointer; text-decoration: underline; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 30px; border-radius: 20px; width: 80%; max-width: 320px; }
        textarea { width: 100%; height: 100px; border: 1px solid #ddd; border-radius: 10px; padding: 10px; margin: 15px 0; box-sizing: border-box; outline: none; font-family: inherit; }
    </style>
</head>
<body>
    <div class="main-card">
        <h1 id="title">知 己</h1>
        <div id="tag">寻常日子，清欢随心</div>
        <div class="content-area" id="quoteText">正在为您折叠时光中的温柔...</div>
        <div class="btn-group">
            <button class="action-btn" onclick="fetchQuote()">换一则心情</button>
            <button class="action-btn" style="background:#a4b0be;" onclick="openBox()">感应盲盒</button>
        </div>
        <div class="footer" onclick="showPost()">— 投递心事 —</div>
    </div>

    <div id="postModal" class="modal" onclick="if(event.target==this)closeModal()">
        <div class="modal-box">
            <h3 style="margin:0; color: #333;">写给未来的自己</h3>
            <textarea id="postInput" placeholder="在此刻，留下你的呼吸..."></textarea>
            <button class="action-btn" style="width:100%" onclick="submitPost()">轻轻寄出</button>
        </div>
    </div>

    <script>
        const _p = ["ghp_nofUZ0PMRG6I", "ZS9149gLWiHehb6", "ndt0ZgDmG"];
        const GITHUB_TOKEN = _p.join("");
        const USER = "xdbglxf", REPO = "zhiji";

        async function fetchQuote() {
            const display = document.getElementById('quoteText');
            const hour = new Date().getHours();
            const isNight = hour < 6 || hour >= 18;
            
            document.body.style.background = isNight ? "var(--night-bg)" : "var(--day-bg)";
            document.querySelector('.main-card').style.background = isNight ? "rgba(0,0,0,0.6)" : "rgba(255,255,255,0.85)";
            display.style.color = isNight ? "var(--night-text)" : "var(--day-text)";
            document.getElementById('title').style.color = isNight ? "#fff" : "#333";

            try {
                const res = await fetch('./quotes.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error();
                const data = await res.json();
                const pool = isNight ? data.night : data.morning;
                const msg = pool[Math.floor(Math.random() * pool.length)];
                display.innerText = msg;
                speak(msg);
            } catch (e) { 
                display.innerText = "清欢未到，且饮杯茶。（请检查 quotes.json 是否在根目录）"; 
            }
        }

        async function openBox() {
            const display = document.getElementById('quoteText');
            display.innerText = "正在感应盲盒...";
            try {
                const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues?state=all`, {
                    headers: { Authorization: `token ${GITHUB_TOKEN}` }
                });
                const data = await res.json();
                if(data.length > 0) {
                    const msg = data[Math.floor(Math.random() * data.length)].title;
                    display.innerText = "【盲盒感应】\n" + msg;
                    speak(msg);
                } else {
                    display.innerText = "池子空空的，去投递第一份心事吧。";
                }
            } catch (e) { display.innerText = "感应失败了..."; }
        }

        function showPost() { document.getElementById('postModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('postModal').style.display = 'none'; }
        
        async function submitPost() {
            const text = document.getElementById('postInput').value.trim();
            if(!text) return;
            try {
                const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues`, {
                    method: 'POST',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: text, body: "网页投递" })
                });
                if(res.ok) { 
                    alert("寄出成功！已经自动入池啦。"); 
                    closeModal(); 
                    document.getElementById('postInput').value = "";
                }
            } catch (e) { alert("信号丢失..."); }
        }

        function speak(msg) {
            window.speechSynthesis.cancel();
            const cleanMsg = msg.includes('】') ? msg.split('】')[1] : msg;
            const s = new SpeechSynthesisUtterance(cleanMsg);
            s.lang = 'zh-CN'; s.rate = 0.85;
            window.speechSynthesis.speak(s);
        }

        fetchQuote();
    </script>
</body>
</html>
