<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知己 - 云端交互版</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #002b2b; font-family: "STKaiti", serif; color: #004d4d; overflow: hidden; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1500&q=80'); background-size: cover; opacity: 0.4; z-index: -1; animation: breathe 20s infinite alternate; }
        @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.05); } }
        .card { background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 25px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        #display { font-size: 1.3rem; line-height: 1.6; margin: 20px 0; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        .btn { background: #008080; color: white; border: none; padding: 12px 30px; border-radius: 50px; font-size: 1rem; cursor: pointer; transition: 0.3s; width: 100%; margin-bottom: 10px; }
        .btn:disabled { background: #ccc; }
        .info { font-size: 0.8rem; color: #666; }
        .admin-btn { position: fixed; bottom: 20px; right: 20px; opacity: 0.3; background: none; border: none; font-size: 20px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="card">
        <div id="display">今日机缘，待您开启</div>
        <button id="openBtn" class="btn" onclick="openBox()">开启盲盒</button>
        <div class="info" id="countInfo">今日剩余开启次数: 3</div>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
        <button class="btn" style="background:#556b2f" onclick="showPost()">我也要投递</button>
    </div>

    <div id="modal" class="modal">
        <h3 id="modalTitle">投递心里话</h3>
        <textarea id="inputText" style="width:100%; height:120px; border-radius:10px; padding:10px;"></textarea>
        <button id="submitBtn" class="btn" style="margin-top:15px;" onclick="actionSubmit()">确认提交</button>
        <div id="adminList"></div>
        <button class="btn" style="background:#8b0000; margin-top:20px;" onclick="closeModal()">关闭</button>
    </div>

    <button class="admin-btn" onclick="showAdmin()">🕯️</button>

    <script>
       // --- 核心配置（老板请在这里填入您的真实信息） ---
const GITHUB_TOKEN = "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"; 
const USER = "xdbglxf";  
const REPO = "zhiji";    // 如果您的仓库名是别的，把 zhiji 换掉就行
// ------------------------------------------

        let userStats = JSON.parse(localStorage.getItem('zhiji_stats')) || { date: "", count: 0 };

        // 检查每日次数
        function checkDate() {
            const today = new Date().toDateString();
            if (userStats.date !== today) {
                userStats = { date: today, count: 0 };
                localStorage.setItem('zhiji_stats', JSON.stringify(userStats));
            }
            document.getElementById('countInfo').innerText = `今日剩余开启次数: ${3 - userStats.count}`;
            if (userStats.count >= 3) document.getElementById('openBtn').disabled = true;
        }

        // 开启盲盒：从 GitHub Issues 获取已关闭（代表审核通过）的条目
        async function openBox() {
            if (userStats.count >= 3) return;
            document.getElementById('display').innerText = "正在感应...";
            
            try {
                // 我们获取状态为 'closed' 的 Issue，作为通过审核的盲盒
                const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues?state=closed`, {
                    headers: { Authorization: `token ${GITHUB_TOKEN}` }
                });
                const data = await res.json();
                
                if (data.length === 0) {
                    document.getElementById('display').innerText = "池子里还没有通过审核的话，请稍后再来。";
                    return;
                }

                const randomIssue = data[Math.floor(Math.random() * data.length)];
                const text = randomIssue.title;
                document.getElementById('display').innerText = text;

                // 计数
                userStats.count++;
                localStorage.setItem('zhiji_stats', JSON.stringify(userStats));
                checkDate();

                // 语音
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'zh-CN';
                window.speechSynthesis.speak(speech);

            } catch (e) {
                alert("感应失败，请检查配置");
            }
        }

        // 投稿：提交到 GitHub Issues
        async function actionSubmit() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) return;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerText = "正在飞往云端...";

            try {
                await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues`, {
                    method: 'POST',
                    headers: { Authorization: `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: text, body: "来自用户的匿名投递" })
                });
                alert("投递成功！待掌柜审核后即可入池。");
                closeModal();
            } catch (e) {
                alert("投递失败");
            }
            document.getElementById('submitBtn').disabled = false;
        }

        function showPost() {
            document.getElementById('modalTitle').innerText = "投递心里话";
            document.getElementById('adminList').style.display = 'none';
            document.getElementById('inputText').style.display = 'block';
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('modal').style.display = 'block';
        }

        async function showAdmin() {
            const pw = prompt("请输入掌柜暗号:");
            if(pw !== "123") return; // 这里的暗号您可以自己改

            document.getElementById('modalTitle').innerText = "待审核列表";
            document.getElementById('inputText').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('adminList').style.display = 'block';
            document.getElementById('modal').style.display = 'block';

            const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues?state=open`, {
                headers: { Authorization: `token ${GITHUB_TOKEN}` }
            });
            const data = await res.json();
            document.getElementById('adminList').innerHTML = data.map(i => `
                <div style="border-bottom:1px solid #eee; padding:10px; font-size:0.9rem;">
                    <p>${i.title}</p>
                    <button onclick="approve(${i.number})" style="color:green">通过</button>
                </div>
            `).join('') || "暂无待审核内容";
        }

        async function approve(num) {
            // 通过审核即关闭该 Issue
            await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues/${num}`, {
                method: 'PATCH',
                headers: { Authorization: `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: 'closed' })
            });
            alert("审核通过！");
            showAdmin();
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        checkDate();
    </script>
</body>
</html>
