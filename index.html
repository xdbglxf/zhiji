<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/008080/mountain.png">
    <title>知己 - 留言盲盒</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #004d4d; font-family: "STKaiti", serif; color: #333; }
        .container { text-align: center; padding: 40px 20px; background: rgba(255, 255, 255, 0.9); border-radius: 30px; width: 85%; max-width: 350px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        #quote-display { font-size: 1.4rem; line-height: 1.6; margin: 30px 0; min-height: 80px; }
        button { padding: 12px 40px; font-size: 1.1rem; cursor: pointer; background: #008080; color: white; border: none; border-radius: 50px; margin-top: 10px; }
        .admin-btn { position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; background: rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; border: none; }
        .input-area { display: none; margin-top: 20px; }
        textarea { width: 100%; border-radius: 10px; border: 1px solid #ccc; padding: 10px; font-size: 1rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="quote-display">开启您的专属盲盒</div>
        <button onclick="openBox()">开启盲盒</button>
        
        <div id="input-area" class="input-area">
            <textarea id="new-msg" placeholder="在这里写下想对家人说的话..."></textarea>
            <button onclick="saveMsg()" style="background: #2c3e50;">存入盲盒</button>
        </div>
    </div>

    <button class="admin-btn" onclick="toggleInput()">✍️</button>

    <script>
        // 默认的一些话
        let messages = JSON.parse(localStorage.getItem('myMessages')) || [
            "登虞山望远，心旷神怡。",
            "今日尚湖边漫步，想到了你。",
            "记得多喝温水，照顾好自己。"
        ];

        function openBox() {
            const display = document.getElementById('quote-display');
            const randomIndex = Math.floor(Math.random() * messages.length);
            display.innerText = messages[randomIndex];
        }

        function toggleInput() {
            const area = document.getElementById('input-area');
            area.style.display = area.style.display === 'block' ? 'none' : 'block';
        }

        function saveMsg() {
            const input = document.getElementById('new-msg');
            if (input.value.trim() !== "") {
                messages.push(input.value);
                localStorage.setItem('myMessages', JSON.stringify(messages));
                alert("已存入盲盒池！");
                input.value = "";
                toggleInput();
            }
        }
    </script>
</body>
</html>
