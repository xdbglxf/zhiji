<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知己 | 你的私人角落</title>
    <style>
        /* 这里的颜色完全参考您截图的粉紫色系 */
        :root { 
            --bg-color: #fce4ec; 
            --accent-color: #f06292;
            --text-main: #4a4a4a;
            --text-sub: #880e4f;
        }
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: var(--bg-color); 
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-main);
        }
        .main-card { 
            background: rgba(255, 255, 255, 0.92); 
            padding: 50px 30px; 
            border-radius: 40px; 
            width: 85%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(240, 98, 146, 0.15); 
            position: relative;
        }
        /* 顶部称呼 */
        h1 { 
            font-size: 1.8rem; 
            color: var(--text-sub); 
            margin-bottom: 5px;
            font-weight: 500;
        }
        .subtitle { 
            font-size: 0.9rem; 
            color: #f48fb1; 
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        /* 核心暖心语区域 */
        .warm-quote { 
            font-size: 1.25rem; 
            line-height: 1.8; 
            color: var(--text-main); 
            margin: 40px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
        }
        /* 模式按钮 */
        .mode-group { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; }
        .mode-btn { 
            border: none; 
            padding: 12px 25px; 
            border-radius: 50px; 
            color: white; 
            cursor: pointer; 
            transition: 0.3s;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .sun { background: #ffb1b1; }
        .moon { background: #a29bfe; }
        
        /* 附带的小功能入口 */
        .appendix { 
            border-top: 1px solid #fce4ec; 
            padding-top: 25px; 
            display: flex; 
            justify-content: space-around;
        }
        .app-link { 
            background: none; 
            border: none; 
            color: #adadad; 
            font-size: 0.85rem; 
            cursor: pointer; 
            text-decoration: underline;
        }
        
        /* 弹窗 */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(252, 228, 236, 0.8); backdrop-filter: blur(8px); 
            z-index: 100; justify-content: center; align-items: center; 
        }
        .modal-box { 
            background: white; padding: 30px; border-radius: 30px; width: 80%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        textarea { 
            width: 100%; height: 100px; border: 1px solid #ffebee; 
            border-radius: 15px; padding: 15px; margin: 15px 0; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>你好，老板 ✨</h1>
        <div class="subtitle">— 你的私人情绪伴侣 —</div>
        
        <div class="warm-quote" id="quoteText">
            今天辛苦了，<br>记得给自己一个拥抱。
        </div>
        
        <div class="mode-group">
            <button class="mode-btn sun" onclick="setMode('阳光')">🌞 阳光模式</button>
            <button class="mode-btn moon" onclick="setMode('治愈')">🌙 治愈模式</button>
        </div>

        <div class="appendix">
            <button class="app-link" onclick="openBox()">感应盲盒</button>
            <button class="app-link" onclick="showPost()">投递心事</button>
        </div>
    </div>

    <div id="postModal" class="modal" onclick="if(event.target==this)closeModal()">
        <div class="modal-box">
            <h3 style="margin:0; color: #f06292;">写给未来的自己</h3>
            <textarea id="postInput" placeholder="在此刻，留下你的呼吸..."></textarea>
            <button class="mode-btn sun" style="width:100%" onclick="submitPost()">轻轻寄出</button>
        </div>
    </div>

    <script>
        // 云端配置 (已为您填好)
        const GITHUB_TOKEN = "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";
        const USER = "xdbglxf";
        const REPO = "zhiji";

        const quotes = {
            '阳光': [
                "生活不在别处，当下即是风景。",
                "去奔跑吧，风会带走所有的烦恼。",
                "今天的阳光，是为你准备的礼物。"
            ],
            '治愈': [
                "万物皆有裂痕，那是光照进来的地方。",
                "如果感到疲惫，就去听听风的声音。",
                "慢慢来，好戏都在烟火里。"
            ]
        };

        function setMode(type) {
            const list = quotes[type];
            const random = list[Math.floor(Math.random() * list.length)];
            document.getElementById('quoteText').innerHTML = random;
            document.body.style.background = type === '阳光' ? '#fff9db' : '#fce4ec';
        }

        // 盲盒：抽签
        async function openBox() {
            const display = document.getElementById('quoteText');
            display.innerText = "正在穿越云端...";
            try {
                const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues?state=closed`, {
                    headers: { Authorization: `token ${GITHUB_TOKEN}` }
                });
                const data = await res.json();
                if (data.length > 0) {
                    const msg = data[Math.floor(Math.random() * data.length)].title;
                    display.innerText = msg;
                    // 播报
                    const speech = new SpeechSynthesisUtterance(msg);
                    speech.lang = 'zh-CN';
                    window.speechSynthesis.speak(speech);
                } else {
                    display.innerText = "池子还空着，等你去填满。";
                }
            } catch (e) { display.innerText = "网络断开了，请稍后再试。"; }
        }

        // 投递
        function showPost() { document.getElementById('postModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('postModal').style.display = 'none'; }
        async function submitPost() {
            const text = document.getElementById('postInput').value.trim();
            if(!text) return;
            try {
                await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues`, {
                    method: 'POST',
                    headers: { Authorization: `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: text, body: "匿名投递" })
                });
                alert("已经安全寄出，待掌柜开启。");
                closeModal();
            } catch (e) { alert("信号丢失了..."); }
        }
    </script>
</body>
</html>
