<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知己 - 山水盲盒</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover; font-family: "STKaiti", "KaiTi", serif; transition: background 1.2s ease;
        }
        body::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(8px); z-index: -1; }
        .container { text-align: center; padding: 40px 25px; background: rgba(255, 255, 255, 0.75); border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); width: 85%; max-width: 350px; border: 1px solid rgba(255,255,255,0.8); }
        #type-tag { font-size: 0.8rem; color: #666; margin-bottom: 15px; border: 1px solid #aaa; display: inline-block; padding: 2px 12px; border-radius: 12px; font-weight: bold; }
        #quote-display { font-size: 1.4rem; line-height: 1.6; margin-bottom: 30px; min-height: 100px; color: #2c3e50; display: flex; align-items: center; justify-content: center; }
        button { padding: 12px 40px; font-size: 1.1rem; cursor: pointer; background: #2c3e50; color: white; border: none; border-radius: 50px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); transition: 0.3s; }
        .fade-in { animation: fadeIn 0.8s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div id="type-tag">山水盲盒</div>
        <div id="quote-display">点击下方开启今日份的美妙</div>
        <button onclick="openBox()">开启盲盒</button>
    </div>
    <script>
        const boxContent = [
            {type: "🏮 宜", text: "登虞山望远。目之所及，皆是风景。"},
            {type: "☁️ 忌", text: "忧虑明天。今日的阳光已经足够温暖。"},
            {type: "🍵 雅", text: "尚湖边品茗。半卷闲书，一盏清茶。"},
            {type: "✨ 运", text: "今日财运：上吉。或许会有意外的小惊喜。"},
            {type: "❤️ 暖", text: "家人平安。这是生活送你最厚重的礼物。"},
            {type: "📜 诗", text: "且将新火试新茶，诗酒趁年华。"}
        ];
        const bgImages = [
            'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1350&q=80',
            'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1350&q=80',
            'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1350&q=80'
        ];
        function openBox() {
            const display = document.getElementById('quote-display');
            const tag = document.getElementById('type-tag');
            const randomItem = boxContent[Math.floor(Math.random() * boxContent.length)];
            display.classList.remove('fade-in');
            void display.offsetWidth; 
            display.classList.add('fade-in');
            tag.innerText = randomItem.type;
            display.innerText = randomItem.text;
            document.body.style.backgroundImage = `url('${bgImages[Math.floor(Math.random() * bgImages.length)]}')`;
        }
    </script>
</body>
</html>
