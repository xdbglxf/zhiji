<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知己 - 你的专属避风港</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* 绚烂的彩虹极光背景：橙、粉、蓝、绿流动 */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: "STKaiti", "KaiTi", "Microsoft YaHei", serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            padding: 50px 30px;
            /* 毛玻璃质感 */
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 400px;
            border: 2px solid rgba(255,255,255,0.5);
        }

        #greeting {
            font-size: 1.2rem;
            margin-bottom: 30px;
            letter-spacing: 3px;
            color: #6c5ce7;
            font-weight: bold;
        }

        #quote-display {
            font-size: 1.5rem;
            line-height: 1.8;
            margin-bottom: 40px;
            min-height: 120px;
            color: #2d3436;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bubble-pop {
            animation: bubble 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bubble {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        button {
            padding: 15px 45px;
            font-size: 1.1rem;
            cursor: pointer;
            background: linear-gradient(to right, #ff6b6b, #ff8e53);
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            transition: all 0.3s;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="greeting">你好，老板</div>
        <div id="quote-display">点击下方，遇见美妙</div>
        <button onclick="getNewQuote()">遇见美妙</button>
    </div>

    <script>
        const quotes = [
            "辛苦啦，那个在数据里穿行、在生活里撑伞的你。",
            "能把柴米油盐经营出诗意，也是一种了不起的超能力。",
            "即便世界再喧嚣，你依然是自己最稳固的靠山。",
            "去虞山看一场雾吧，世界会温柔地抱住你。",
            "现在的你，就是最好的你。",
            "尚湖的微风吹过，带走了所有的不愉快。",
            "没事，吃颗糖，剩下的交给明天。",
            "生活碎了一地，你也是最亮的那颗瓷片。",
            "你不需要完美，你只需要是你自己。"
        ];

        function getNewQuote() {
            const display = document.getElementById('quote-display');
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const selectedQuote = quotes[randomIndex];
            
            display.classList.remove('bubble-pop');
            void display.offsetWidth; 
            display.classList.add('bubble-pop');
            display.innerText = selectedQuote;
        }
    </script>
</body>
</html>
